# 🥤 NovaLat - Docker Compose Simplificado
# Sistema de trazabilidad alimentaria

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15
    container_name: novalat-postgres
    environment:
      POSTGRES_DB: novalat_traceability
      POSTGRES_USER: novalat_user
      POSTGRES_PASSWORD: novalat_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novalat_user -d novalat_traceability"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: novalat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API de Trazabilidad
  api:
    build: .
    container_name: novalat-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://novalat_user:novalat_pass@postgres:5432/novalat_traceability
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=novalat-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: novalat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana para dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: novalat-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: 